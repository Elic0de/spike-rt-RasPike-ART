INCLUDE("tecsgen.cfg");

#include "raspike.h"
CRE_TSK(APP_MAIN_TASK, { TA_ACT, 0, main_task, MAIN_PRIORITY, MAIN_STACK_SIZE, NULL });

/* Control and command handling must never be starved by blocking telemetry I/O. */
CRE_TSK(APP_SAFETY_TASK, { TA_NULL, 0, safety_supervisor_task, MAIN_PRIORITY-1, CRITICAL_TX_STACK_SIZE, NULL });
CRE_CYC(APP_SAFETY_CYC, { TA_NULL, {TNFY_HANDLER,0,safety_supervisor_cyclic_handler}, 4*1000, 0});

CRE_TSK(APP_DRIVE_CONTROL_TASK, { TA_NULL, 0, realtime_drive_task, MAIN_PRIORITY-2, MAIN_STACK_SIZE, NULL });
CRE_CYC(APP_DRIVE_CONTROL_4MS_CYC, { TA_NULL, {TNFY_HANDLER,0,realtime_drive_cyclic_handler}, 4*1000, 0});
CRE_CYC(APP_DRIVE_CONTROL_10MS_CYC, { TA_NULL, {TNFY_HANDLER,0,realtime_drive_cyclic_handler}, 10*1000, 0});

/* Only this low-priority task may wait for USB TX space. Critical frames are
   copied into a bounded queue before the command path returns. */
CRE_TSK(APP_CRITICAL_TX_TASK, { TA_NULL, 0, critical_tx_task, MAIN_PRIORITY+1, CRITICAL_TX_STACK_SIZE, NULL });

CRE_TSK(APP_DRIVE_TELEMETRY_TASK, { TA_NULL, 0, drive_telemetry_task, MAIN_PRIORITY+2, MAIN_STACK_SIZE, NULL });
CRE_CYC(APP_DRIVE_TELEMETRY_CYC, { TA_NULL, {TNFY_ACTTSK,APP_DRIVE_TELEMETRY_TASK}, 10*1000, 0});

CRE_TSK(APP_NOTIFY_TASK, { TA_NULL, 0, notify_task, MAIN_PRIORITY+3, MAIN_STACK_SIZE, NULL });
CRE_CYC(APP_NOTIFY_CYC, { TA_NULL, {TNFY_ACTTSK,APP_NOTIFY_TASK}, 50*1000, 0});


CRE_TSK(APP_RUNTIME_TELEMETRY_TASK, { TA_NULL, 0, runtime_telemetry_task, MAIN_PRIORITY+3, MAIN_STACK_SIZE, NULL });
CRE_CYC(APP_RUNTIME_TELEMETRY_CYC, { TA_NULL, {TNFY_ACTTSK,APP_RUNTIME_TELEMETRY_TASK}, 10*1000, 0});

CRE_TSK(APP_SONER_TASK, { TA_NULL, 0, soner_task, MAIN_PRIORITY+4, MAIN_STACK_SIZE, NULL });
CRE_CYC(APP_SONER_CYC, { TA_NULL, {TNFY_ACTTSK,APP_SONER_TASK}, 20*1000, 0});

/* Command/config writers inherit control priority while mutating controller
   state. The control loop reads the atomically published command mailbox
   without taking this mutex. Safety never takes it. */
CRE_MTX(APP_DRIVE_STATE_MUTEX,{ TA_CEILING, MAIN_PRIORITY-2 });
CRE_MTX(APP_STATUS_MUTEX,{ TA_CEILING, MAIN_PRIORITY-2 });
CRE_MTX(APP_SEQUENCE_MUTEX,{ TA_CEILING, MAIN_PRIORITY });
